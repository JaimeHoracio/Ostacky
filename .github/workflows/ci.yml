name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinneado: el hash del bundle de dist/mcp depende del output de bun.
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Install MCP server dependencies
        run: |
          for dir in assets/mcp/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Installing deps in $dir"
              (cd "$dir" && bun install --frozen-lockfile)
            fi
          done

      - name: Build (CLI + MCP bundles)
        run: bun run build

      - name: Run tests
        run: bun run test:safe

      - name: Check skill sync
        run: bun run check:skills

      - name: Check manifest hashes
        # Corre después del build: dist/mcp existe, así que valida el sha256 del
        # artefacto además del sourceSha256 del árbol.
        run: bun run scripts/update-manifest-hashes.ts --check

      - name: Validate OpenSpec specs
        run: bunx openspec validate --all --strict
